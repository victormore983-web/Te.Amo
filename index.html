<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa_roja🌹</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 97vh;
            margin: 0;
            background: linear-gradient(160deg, #ffe6f4 0%, #fa168c 35%, #f7b9de 70%, #f444c8 100%);
            font-family: sans-serif;
        }

        #pantalla-bloqueo {
            display: none;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            z-index: 10000;
        }

        .input-clave { padding: 10px; font-size: 16px; border: 2px solid #ff69b4; border-radius: 8px; text-align: center; }
        .btn-validar { padding: 10px 20px; font-size: 16px; background: #ff0073; color: white; border: none; border-radius: 8px; cursor: pointer; margin-left: 5px; font-weight: bold; }
        
        #contenido-principal { display: none; width: 100%; height: 100%; position: relative; }

        .flower { display: flex; flex-direction: column-reverse; align-items: center; animation: float 3s ease-in-out infinite; position: relative; z-index: -1; }
        .flower__wrapper { position: relative; padding: 2vh 7vh; border-radius: 50% 50% 0 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; }

        .btn-whatsapp {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            z-index: 9999;
        }
        .btn-whatsapp:hover { transform: scale(1.1); }

        .flower__sparkles { position: absolute; inset: 0; pointer-events: none; }
        .flower__sparkle { position: absolute; width: 6px; height: 6px; background: radial-gradient(circle, #fff 40%, #d7ecff 70%, transparent 100%); border-radius: 50%; filter: drop-shadow(0 0 6px #fff); animation: sparkle-flicker 2s infinite ease-in-out; }
        
        @keyframes sparkle-flicker { 0%, 100% { transform: scale(0.6); opacity: 0.4; } 50% { transform: scale(1.4); opacity: 1; } }
        
        .imagen { margin-top: 5vh; height: 40vh; width: 25vh; }
        .titulo { position: absolute; top: 5vh; left: 50%; transform: translateX(-50%); width: 90%; text-align: center; color: rgb(255, 0, 0); font-size: 3vh; font-weight: bold; opacity: 0; animation: fadeIn 4s ease-in-out forwards; z-index: 9999; text-shadow: 0 0 10px #fff; }
        
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>

<body>

    <div id="pantalla-bloqueo">
        <h2>Ingresa la autorización</h2>
        <input type="password" id="clave-input" class="input-clave" placeholder="Contraseña">
        <button onclick="verificarClave()" class="btn-validar">Acceder</button>
        <p id="mensaje-error" style="color: red; display: none; margin-top: 10px;">Clave incorrecta</p>
    </div>

    <div id="contenido-principal">
        <h1 class="titulo">Creador VIC👿PERSI... ❤️</h1>

        <div class="flower__wrapper">
            <div class="flower__sparkles">
                <div class="flower__sparkle" style="top: 10%; left: 20%;"></div>
                <div class="flower__sparkle" style="top: 30%; left: 80%;"></div>
                <div class="flower__sparkle" style="top: 60%; left: 10%;"></div>
            </div>

            <div class="flower">
                <img class="imagen" src="https://i.pinimg.com/originals/4d/80/56/4d80564c89721f9a75cd1df36e42a467.gif">
            </div>

            <!-- BOTÓN WHATSAPP -->
            <a href="https://wa.me/qr/GEELF4EW2PWRL1" target="_blank" class="btn-whatsapp">
                💬 Escríbeme aquí
            </a>

            <h2 id="frase" style="margin-top: 30px; color: #ff0073; text-align: center; font-size: 2.5vh; text-shadow: 0 0 5px #fff;"></h2>
        </div>

        <audio id="musica" src="https://files.catbox.moe/clrk20.mp3"></audio>
    </div>

    <script>
        const CLAVE_CORRECTA = "amor2026";

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem("contenidoVisto") === "true") {
                document.getElementById("contenido-principal").style.display = "none";
                document.getElementById("pantalla-bloqueo").style.display = "block";
            } else {
                document.getElementById("contenido-principal").style.display = "block";
                localStorage.setItem("contenidoVisto", "true");
            }
        });

        function verificarClave() {
            if (document.getElementById("clave-input").value === CLAVE_CORRECTA) {
                document.getElementById("pantalla-bloqueo").style.display = "none";
                document.getElementById("contenido-principal").style.display = "block";
            } else {
                document.getElementById("mensaje-error").style.display = "block";
            }
        }

        const frases = ["Amarte es mi parte favorita del día ❤️", "Tu sonrisa ilumina todo lo que soy ✨", "Contigo todo es más bonito 🌸"];
        let i = 0;
        const fraseEl = document.getElementById('frase');
        setInterval(() => {
            i = (i + 1) % frases.length;
            fraseEl.style.opacity = 0;
            setTimeout(() => { fraseEl.textContent = frases[i]; fraseEl.style.opacity = 1; }, 300);
        }, 3000);

        document.addEventListener('click', () => {
            const audio = document.getElementById('musica');
            if (audio && audio.paused) audio.play().catch(()=>{});
        }, { once: true });
    </script>
</body>
</html>
